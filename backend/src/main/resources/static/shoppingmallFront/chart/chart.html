<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>chart test</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@1.0.2/Chart.min.js"></script>
    <!-- <script src="./Chart.js"></script> --> 
     <!-- 로컬에서 테스트할 때는 이 줄의 주석을 해제하고 위의 CDN 링크를 주석 처리 -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Dotum, Arial, sans-serif;
      }

      #chartWrap {
        position: relative;
        width: 100%;
        height: 100%;
      }

      #canvas {
        display: block;
      }

      #legend {
        position: absolute;
        top: 0;
        right: 12px;
        padding: 4px 8px;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid #cccccc;
        font:
          12px Dotum,
          Arial,
          sans-serif;
        z-index: 10;
      }

      #legend ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      #legend li {
        display: inline-block;
        margin-right: 12px;
        line-height: 18px;
        white-space: nowrap;
      }

      #legend span {
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-right: 6px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div id="chartWrap">
      <canvas id="canvas" width="800" height="400"></canvas>
      <div id="legend"></div>
    </div>

    <script>
      var chart = null;

      function drawChart(type, data, options) {
        var canvas = document.getElementById("canvas");
        var legend = document.getElementById("legend");

        if (!canvas) {
          alert("canvas not found");
          return;
        }

        if (!canvas.getContext) {
          alert("canvas.getContext not supported");
          return;
        }

        var ctx = canvas.getContext("2d");

        if (chart != null) {
          chart.destroy();
        }

        if (legend) {
          legend.innerHTML = "";
        }

        if (!options) {
          options = {};
        }
        // legendTemplate이 없는 경우 기본 템플릿을 설정하여 범례가 표시되도록 함
        if (!options.legendTemplate) {
          options.legendTemplate =
            '<ul class="<%=name.toLowerCase()%>-legend">' +
            "<% for (var i=0; i<datasets.length; i++){%>" +
            "<li>" +
            '<span style="background-color:<%=datasets[i].strokeColor || datasets[i].fillColor%>"></span>' +
            "<%if(datasets[i].label){%><%=datasets[i].label%><%}%>" +
            "</li>" +
            "<%}%>" +
            "</ul>";
        }

        switch ((type || "").toLowerCase()) {
          case "line":
            chart = new Chart(ctx).Line(data, options);
            break;
          case "bar":
            chart = new Chart(ctx).Bar(data, options);
            break;
          case "radar":
            chart = new Chart(ctx).Radar(data, options);
            break;
          case "polararea":
            chart = new Chart(ctx).PolarArea(data, options);
            break;
          case "pie":
            chart = new Chart(ctx).Pie(data, options);
            break;
          case "doughnut":
            chart = new Chart(ctx).Doughnut(data, options);
            break;
          default:
            alert("unknown chart type: " + type);
            break;
        }

        if (chart && chart.generateLegend && legend) {
          legend.innerHTML = chart.generateLegend();
        }
      }
    </script>
  </body>
</html>
